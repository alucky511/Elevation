name: Android checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compile SDKs
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, debug builds and lint
        run: gradle :mobile:testDebugUnitTest :wear:testDebugUnitTest :mobile:assembleDebug :wear:assembleDebug :mobile:lintDebug :wear:lintDebug --stacktrace
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            mobile/build/reports/
            mobile/build/test-results/
            wear/build/reports/
            wear/build/test-results/
      - name: Save debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: elevation-debug-apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check layouts and icon safe area on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle :mobile:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.elevation/files/ui-previews ui-previews
      - name: Save UI previews and instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elevation-ui-previews
          path: |
            ui-previews/
            mobile/build/reports/androidTests/
            mobile/build/outputs/androidTest-results/
